# https://taskfile.dev

version: "3"

tasks:
  default:
    - task --list-all

  lint:
    # v0.14 removes this flag and requires Go 1.26.
    - go run github.com/nishanths/exhaustive/cmd/exhaustive@v0.13.0 -default-signifies-exhaustive ./...
    - go run honnef.co/go/tools/cmd/staticcheck@latest ./...
    - go vet ./...

  release:
    deps: [tidy, lint, test, fmt]
    cmds:
      - go build -tags="release"

  tidy:
    - go mod tidy -v

  update-deps:
    cmds:
      - go get -u
      - go clean -modcache
      - task tidy

  test:
    - go test -v -timeout 3m 

  run:
    - go run .

  dev:
    - air -c .air.toml

  fmt:
    - go fmt ./...
